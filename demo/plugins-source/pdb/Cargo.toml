[package]
name = "pdb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "A function-wasm plugin that adds a PodDisruptionBudget for the composed Deployment."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde = "1"
serde_json = "1"
wit-bindgen = "0.61"
# Only the API groups this plugin imports, from the project's generated models.
crossplane-models = { path = "../../../schemas/rust", default-features = false, features = [
    "io-k8s-api-apps-v1",
    "io-k8s-api-policy-v1",
    "io-k8s-apimachinery-pkg-apis-meta-v1",
    "io-k8s-apimachinery-pkg-util-intstr",
] }

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
